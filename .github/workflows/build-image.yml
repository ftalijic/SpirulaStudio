name: Build and push Spirula Studio image

# No compile step (Spirula ships a prebuilt Linux binary, COLMAP comes from
# the already-built oblaq-colmap-base), so this is a few-minute job and the
# LichtFeld workflow's vcpkg cache machinery isn't needed here.
on:
  workflow_dispatch:
    inputs:
      spirula_version:
        description: "Spirula release (without the v), e.g. 2026.9.24 - leave empty to use the Dockerfile's pinned value"
        required: false
        default: ""
      spirula_sha256:
        description: "sha256 of spirula-<version>-ubuntu-vulkan-x86_64.zip (required if you change the version)"
        required: false
        default: ""
  push:
    branches: [main, master]
    paths:
      - "Dockerfile"
      - "start.sh"
      - "colmap-wrapper.sh"
      - ".github/workflows/build-image.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      # The final image is large (CUDA runtime + COLMAP's closure) - give the
      # runner room, same as the LichtFeld workflow.
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build args
        id: args
        run: |
          {
            echo "args<<EOF"
            if [ -n "${{ github.event.inputs.spirula_version }}" ]; then
              echo "SPIRULA_VERSION=${{ github.event.inputs.spirula_version }}"
              echo "SPIRULA_SHA256=${{ github.event.inputs.spirula_sha256 }}"
            fi
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          pull: true   # always re-pull dakord/oblaq-colmap-base:latest
          build-args: ${{ steps.args.outputs.args }}
          tags: |
            dakord/spirula-studio:latest
            dakord/spirula-studio:${{ github.run_number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
